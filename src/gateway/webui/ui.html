<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clawzero</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-message: #0f3460;
  --bg-user: #533483;
  --text: #e0e0e0;
  --text-muted: #8a8a9a;
  --accent: #e94560;
  --border: #2a2a4a;
  --tool-bg: #1a2744;
  --success: #4caf50;
  --error: #f44336;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: 18px;
  font-weight: 600;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.header-actions button {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
}

.header-actions button:hover { background: var(--border); }

.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--error);
  display: inline-block;
}

.status-dot.connected { background: var(--success); }

.sidebar {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 300px; height: 100%;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  z-index: 100;
  flex-direction: column;
}

.sidebar.open { display: flex; }

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h2 { font-size: 16px; }

.sidebar-close {
  background: none; border: none;
  color: var(--text); cursor: pointer;
  font-size: 20px;
}

.session-list {
  flex: 1; overflow-y: auto; padding: 8px;
}

.session-item {
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 4px;
  font-size: 13px;
}

.session-item:hover { background: var(--border); }

.session-item .session-model { color: var(--text-muted); font-size: 11px; }

.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}

.overlay.open { display: block; }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 800px;
  margin: 0 auto 16px;
  padding: 12px 16px;
  border-radius: 8px;
  line-height: 1.6;
}

.message.user {
  background: var(--bg-user);
  margin-left: 20%;
}

.message.assistant {
  background: var(--bg-message);
}

.message.assistant .content { word-wrap: break-word; }
.message.assistant .content pre {
  background: rgba(0,0,0,0.3);
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
  margin: 8px 0;
}
.message.assistant .content code {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
}
.message.assistant .content p { margin: 4px 0; }
.message.assistant .content ul, .message.assistant .content ol {
  padding-left: 20px; margin: 4px 0;
}

.tool-card {
  background: var(--tool-bg);
  border-left: 3px solid var(--text-muted);
  border-radius: 4px;
  padding: 8px 12px;
  margin: 8px 0;
  font-size: 13px;
}

.tool-card.success { border-left-color: var(--success); }
.tool-card.error { border-left-color: var(--error); }

.tool-card .tool-name {
  font-weight: 600;
  margin-bottom: 4px;
}

.tool-card .tool-output {
  color: var(--text-muted);
  white-space: pre-wrap;
  max-height: 200px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
}

.thinking {
  display: none;
  max-width: 800px;
  margin: 0 auto;
  padding: 8px 16px;
  color: var(--text-muted);
  font-size: 13px;
}

.thinking.active { display: block; }

.thinking::after {
  content: '';
  animation: dots 1.4s infinite;
}

@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}

.input-area {
  padding: 12px 20px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
}

.input-wrap {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
}

.input-wrap textarea {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  resize: none;
  min-height: 42px;
  max-height: 200px;
  line-height: 1.4;
}

.input-wrap textarea:focus { outline: none; border-color: var(--accent); }

.input-wrap button {
  padding: 10px 18px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  align-self: flex-end;
}

.input-wrap button:hover { opacity: 0.9; }
.input-wrap button:disabled { opacity: 0.4; cursor: not-allowed; }

.usage {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px;
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Sessions</h2>
    <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="session-list" id="sessionList"></div>
</div>

<div class="header">
  <h1>clawzero</h1>
  <div class="header-actions">
    <span class="status-dot" id="statusDot" title="Disconnected"></span>
    <button onclick="newSession()">New</button>
    <button onclick="openSidebar()">Sessions</button>
  </div>
</div>

<div class="messages" id="messages"></div>
<div class="thinking" id="thinking">Thinking</div>
<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Type a message... (Shift+Enter for newline)"
      onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
// Minimal marked.js-like Markdown parser
const md = {
  render(src) {
    if (!src) return '';
    let html = src
      // Code blocks
      .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
        `<pre><code class="language-${lang}">${this.esc(code.trimEnd())}</code></pre>`)
      // Inline code
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // Bold
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      // Italic
      .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>')
      // Headers
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // Unordered lists
      .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
      // Ordered lists
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      // Line breaks (double newline = paragraph, single = br)
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    // Wrap consecutive <li> in <ul>
    html = html.replace(/((?:<li>.*<\/li>(?:<br>)?)+)/g, '<ul>$1</ul>');
    html = html.replace(/<ul>(.*?)<\/ul>/gs, (_, inner) =>
      '<ul>' + inner.replace(/<br>/g, '') + '</ul>');
    return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
  },
  esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
};

let ws = null;
let sessionId = null;
let isStreaming = false;
let currentAssistantEl = null;
let currentText = '';

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('statusDot').classList.add('connected');
    document.getElementById('statusDot').title = 'Connected';
  };

  ws.onclose = () => {
    document.getElementById('statusDot').classList.remove('connected');
    document.getElementById('statusDot').title = 'Disconnected';
    setTimeout(connect, 3000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    const event = JSON.parse(e.data);
    handleServerEvent(event);
  };
}

function handleServerEvent(event) {
  switch (event.type) {
    case 'session_created':
      sessionId = event.session_id;
      break;

    case 'text_delta':
      if (!currentAssistantEl) {
        currentAssistantEl = addMessage('assistant', '');
        currentText = '';
      }
      currentText += event.text;
      currentAssistantEl.querySelector('.content').innerHTML = md.render(currentText);
      scrollToBottom();
      break;

    case 'tool_call_start': {
      if (!currentAssistantEl) {
        currentAssistantEl = addMessage('assistant', '');
        currentText = '';
      }
      const card = document.createElement('div');
      card.className = 'tool-card';
      card.id = `tool-${event.id}`;
      card.innerHTML = `<div class="tool-name">\u2699\ufe0f ${event.name}...</div>`;
      currentAssistantEl.appendChild(card);
      scrollToBottom();
      break;
    }

    case 'tool_result': {
      const card = document.getElementById(`tool-${event.id}`);
      if (card) {
        card.className = `tool-card ${event.is_error ? 'error' : 'success'}`;
        const icon = event.is_error ? '\u274c' : '\u2705';
        const inputStr = formatToolInput(event.name, event.input);
        let html = `<div class="tool-name">${icon} ${event.name}: ${md.esc(inputStr)}</div>`;
        if (event.output) {
          const trimmed = event.output.length > 500
            ? event.output.substring(0, 500) + '...'
            : event.output;
          html += `<div class="tool-output">${md.esc(trimmed)}</div>`;
        }
        card.innerHTML = html;
      }
      scrollToBottom();
      break;
    }

    case 'done':
      setStreaming(false);
      if (event.total_usage) {
        const usage = document.createElement('div');
        usage.className = 'usage';
        usage.textContent = `tokens: ${event.total_usage.input_tokens} in / ${event.total_usage.output_tokens} out`;
        if (currentAssistantEl) currentAssistantEl.appendChild(usage);
      }
      currentAssistantEl = null;
      currentText = '';
      break;

    case 'error':
      setStreaming(false);
      if (!currentAssistantEl) {
        currentAssistantEl = addMessage('assistant', '');
      }
      const errDiv = document.createElement('div');
      errDiv.style.color = 'var(--error)';
      errDiv.textContent = `Error: ${event.message}`;
      currentAssistantEl.appendChild(errDiv);
      currentAssistantEl = null;
      currentText = '';
      break;
  }
}

function formatToolInput(name, input) {
  if (!input) return '';
  switch (name) {
    case 'bash': return `$ ${input.command || ''}`;
    case 'file_read': return `path: ${input.path || ''}`;
    case 'file_write': return `path: ${input.path || ''} (${(input.content||'').length} bytes)`;
    case 'file_edit': return `path: ${input.path || ''}`;
    default: return JSON.stringify(input).substring(0, 100);
  }
}

function addMessage(role, text) {
  const el = document.createElement('div');
  el.className = `message ${role}`;
  if (role === 'assistant') {
    el.innerHTML = `<div class="content">${md.render(text)}</div>`;
  } else {
    el.textContent = text;
  }
  document.getElementById('messages').appendChild(el);
  scrollToBottom();
  return el;
}

function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN || isStreaming) return;

  addMessage('user', text);
  ws.send(JSON.stringify({ type: 'message', text }));
  input.value = '';
  autoResize(input);
  setStreaming(true);
}

function setStreaming(active) {
  isStreaming = active;
  document.getElementById('thinking').classList.toggle('active', active);
  document.getElementById('sendBtn').disabled = active;
}

function newSession() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'new_session' }));
    document.getElementById('messages').innerHTML = '';
    currentAssistantEl = null;
    currentText = '';
  }
}

async function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  try {
    const resp = await fetch('/api/sessions');
    const data = await resp.json();
    const list = document.getElementById('sessionList');
    list.innerHTML = '';
    if (data.sessions && data.sessions.length > 0) {
      data.sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = 'session-item';
        item.innerHTML = `
          <div>${s.session_id.substring(0, 12)}...</div>
          <div class="session-model">${s.model} &middot; ${s.message_count} msgs</div>
        `;
        item.onclick = () => resumeSession(s.session_id);
        list.appendChild(item);
      });
    } else {
      list.innerHTML = '<div style="padding:16px;color:var(--text-muted)">No sessions yet</div>';
    }
  } catch (e) {
    console.error('Failed to load sessions:', e);
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function resumeSession(id) {
  closeSidebar();
  if (ws && ws.readyState === WebSocket.OPEN) {
    document.getElementById('messages').innerHTML = '';
    currentAssistantEl = null;
    currentText = '';
    ws.send(JSON.stringify({ type: 'resume_session', session_id: id }));
  }
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

connect();
</script>
</body>
</html>
